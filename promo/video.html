<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bookmark sync promo</title>
<style>
:root {
  --bg: #070b14;
  --border: rgba(148, 163, 184, 0.16);
  --text: #e8ecf3;
  --text2: #94a0b4;
  --accent: #3b7bf0;
  --accent2: #7aa7ff;
  --ok: #34d399;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; }
.layer { position: absolute; inset: 0; }
.grid { position: absolute; inset: -128px; background-image: linear-gradient(rgba(148,163,184,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.055) 1px, transparent 1px); background-size: 64px 64px; mask-image: radial-gradient(ellipse at 50% 48%, #000 15%, transparent 68%); }

.head { position: absolute; left: 0; right: 0; top: 74px; text-align: center; font-size: 66px; font-weight: 650; letter-spacing: -0.028em; line-height: 1.1; }
.head .w { display: inline-block; white-space: pre; }
.grad { background: linear-gradient(92deg, #8db4ff, #b49cff); -webkit-background-clip: text; background-clip: text; color: transparent; }

.win { position: absolute; left: 0; top: 0; width: 320px; height: 210px; margin: -105px 0 0 -160px; border-radius: 16px; background: linear-gradient(180deg, #151d2d, #0e1420); border: 1px solid var(--border); overflow: hidden; box-shadow: 0 30px 60px -20px rgba(0,0,0,.75), 0 0 0 0 rgba(59,123,240,0); }
.bar { height: 38px; display: flex; align-items: center; gap: 7px; padding: 0 14px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.025); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #2a3346; }
.bname { margin-left: 8px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.bname i { width: 10px; height: 10px; border-radius: 50%; }
.count { position: absolute; right: 14px; top: 0; height: 38px; display: flex; align-items: center; font-size: 13px; color: var(--text2); }
.count span { position: absolute; right: 0; white-space: nowrap; }
.row { position: absolute; left: 12px; right: 12px; top: 0; height: 34px; display: flex; align-items: center; gap: 11px; padding: 0 10px; border-radius: 8px; font-size: 16px; color: #d6dce7; }
.row .ic { width: 20px; height: 20px; flex: none; display: grid; place-items: center; border-radius: 6px; font-size: 11px; font-weight: 700; color: #0b1020; }
.row .ic svg { width: 20px; height: 20px; color: var(--accent2); }
.row .t { position: relative; flex: 1; height: 22px; }
.row .t span { position: absolute; left: 0; top: 0; white-space: nowrap; }
.row.dupe { background: rgba(251, 191, 36, .1); color: #fcd34d; }

.toast { position: absolute; left: 0; top: 0; height: 34px; padding: 0 14px; border-radius: 17px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; background: var(--accent); color: white; white-space: nowrap; box-shadow: 0 10px 30px -6px rgba(59,123,240,.7); transform: translate(-50%, -50%); }
.pill-ok { position: absolute; right: 12px; top: 8px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; font-weight: 600; color: var(--ok); background: rgba(52, 211, 153, .12); display: flex; align-items: center; gap: 5px; }

.node { position: absolute; left: 0; top: 0; width: 160px; height: 160px; margin: -80px 0 0 -80px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #22365e, #0f1a30 70%); border: 1px solid rgba(122,167,255,.35); box-shadow: 0 0 80px -10px rgba(59,123,240,.55), inset 0 0 30px rgba(122,167,255,.15); }
.node-label { position: absolute; left: 0; top: 0; transform: translate(-50%, 0); font-size: 18px; color: var(--text2); white-space: nowrap; font-weight: 500; }
.logo { position: absolute; left: 0; top: 0; width: 170px; height: 170px; margin: -85px 0 0 -85px; color: var(--accent2); filter: drop-shadow(0 0 30px rgba(59,123,240,.6)); }
.logo svg { width: 100%; height: 100%; }
.title { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; letter-spacing: -0.035em; }
.tag { position: absolute; left: 0; right: 0; text-align: center; color: var(--text2); font-weight: 500; }

.pk { position: absolute; left: 0; top: 0; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: radial-gradient(circle, #fff 0 25%, #8db4ff 45%, rgba(59,123,240,0) 72%); box-shadow: 0 0 22px 6px rgba(91,141,255,.55); }
.pk.tr { width: 10px; height: 10px; margin: -5px 0 0 -5px; box-shadow: 0 0 14px 3px rgba(91,141,255,.35); }
.pk.cipher { width: auto; height: 26px; margin: -13px 0 0 -40px; padding: 0 9px; border-radius: 8px; background: rgba(15, 23, 42, .92); border: 1px solid rgba(180,156,255,.6); color: #c9b8ff; font: 600 14px/24px 'Cascadia Mono', Consolas, monospace; box-shadow: 0 0 18px rgba(180,156,255,.35); }
.ring { position: absolute; left: 0; top: 0; width: 160px; height: 160px; margin: -80px 0 0 -80px; border-radius: 50%; border: 2px solid rgba(122,167,255,.8); }
.chip { position: absolute; left: 0; top: 0; height: 52px; padding: 0 22px; border-radius: 26px; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 600; background: rgba(21, 29, 45, .92); border: 1px solid rgba(122,167,255,.3); box-shadow: 0 12px 40px -10px rgba(0,0,0,.8); white-space: nowrap; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent2); }
.lock { position: absolute; left: 0; top: 0; width: 110px; height: 110px; margin: -55px 0 0 -55px; color: #c9b8ff; filter: drop-shadow(0 0 24px rgba(180,156,255,.7)); }

.frame-wrap { position: absolute; left: 680px; top: 110px; width: 1180px; height: 896px; perspective: 2400px; }
.frame { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; background: #f4f6f9; border: 1px solid rgba(255,255,255,.14); box-shadow: 0 60px 120px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(0,0,0,.4); transform-origin: 30% 50%; }
.fbar { height: 46px; background: #e6e9ef; display: flex; align-items: center; gap: 8px; padding: 0 18px; border-bottom: 1px solid #d5dae2; }
.fbar .d { width: 12px; height: 12px; border-radius: 50%; }
.addr { margin-left: 24px; height: 28px; flex: 0 0 520px; border-radius: 14px; background: #fff; display: flex; align-items: center; gap: 8px; padding: 0 14px; font: 500 14px 'Segoe UI', sans-serif; color: #565d6b; }
.addr svg { width: 15px; height: 15px; color: #2563eb; }
.view { position: absolute; left: 0; top: 46px; width: 1180px; height: 850px; overflow: hidden; }
.slide { position: absolute; inset: 0; }
.slide img { width: 1180px; display: block; }
.hl { position: absolute; border: 3px solid #2563eb; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(15, 23, 42, .28), 0 0 30px rgba(37,99,235,.6); }
.cap { position: absolute; left: 120px; top: 400px; width: 500px; }
.cap .k { font-size: 18px; font-weight: 700; letter-spacing: .16em; color: var(--accent2); margin-bottom: 18px; }
.cap .h { font-size: 54px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; margin-bottom: 20px; }
.cap .s { font-size: 25px; line-height: 1.45; color: var(--text2); }
.popup { position: absolute; left: 0; top: 0; width: 420px; height: 222px; border-radius: 16px; overflow: hidden; background: #f4f6f9; box-shadow: 0 40px 90px -20px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.2); }
.popup img { width: 420px; display: block; }
.page img { width: 1180px; display: block; }
.cursor { position: absolute; left: 0; top: 0; margin: -3px 0 0 -5px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); transform-origin: 5px 3px; }
.ripple { position: absolute; left: 0; top: 0; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: rgba(37,99,235,.28); border: 2px solid rgba(37,99,235,.8); }
.flash { position: absolute; inset: 0; background: #6f9bff; pointer-events: none; }
.burst { position: absolute; left: 0; top: 0; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; border: 3px solid rgba(160,190,255,.9); }
.spark { position: absolute; left: 0; top: 0; border-radius: 50%; background: #b8ccff; }
.shine { background: linear-gradient(100deg, #e8ecf3 0%, #e8ecf3 42%, #ffffff 50%, #a9c4ff 54%, #e8ecf3 62%, #e8ecf3 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
.steps { position: absolute; left: 120px; top: 330px; display: flex; gap: 10px; }
.steps i { width: 34px; height: 4px; border-radius: 2px; background: rgba(148,163,184,.25); }

.browsers { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 34px; font-size: 26px; font-weight: 600; color: #cbd3e1; }
.browsers span { display: flex; align-items: center; gap: 12px; }
.browsers i { width: 12px; height: 12px; border-radius: 50%; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bg"><div class="grid" id="grid"></div></div>
  <div class="layer" id="world"><svg class="layer" id="lines" width="1920" height="1080"></svg></div>
  <div class="layer" id="product"></div>
  <div class="layer" id="outro"></div>
  <div class="flash" id="flash" style="opacity:0"></div>
  <div class="layer" id="fade" style="background:#000;opacity:0"></div>
</div>
<script>
const LOGO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M15 10v11l-5 -3l-5 3v-11a3 3 0 0 1 3 -3h4a3 3 0 0 1 3 3" /><path pathLength="1" d="M11 3h5a3 3 0 0 1 3 3v11" /></svg>';
const FOLDER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2" /></svg>';
const LOCK_BODY = '<path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6z" /><path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" />';
const LOCK_SHACKLE = '<path d="M8 11v-4a4 4 0 1 1 8 0v4" />';
const MERGE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M7 6m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M17 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M7 8l0 8" /><path d="M7 8a4 4 0 0 0 4 4h4" /></svg>';

const EASE = 'cubic-bezier(.22,1,.36,1)';
const INOUT = 'cubic-bezier(.65,0,.35,1)';
const DURATION = 40000;

const $ = (sel) => document.querySelector(sel);
function mk(tag, cls, html, parent) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (html != null) el.innerHTML = html;
  if (parent) parent.append(el);
  return el;
}
// Inline style holds the state before an element's first animation; every animation fills forwards only, so later ones win once they start.
function set(el, style) { Object.assign(el.style, style); return el; }
function A(el, frames, start, dur, easing = EASE) {
  const a = el.animate(frames, { delay: start, duration: dur, fill: 'forwards', easing });
  a.pause();
  return a;
}
const px = ([x, y]) => `${x}px ${y}px`;

const bg = $('#bg'), world = $('#world'), lines = $('#lines'), product = $('#product'), outro = $('#outro');

// Flat colour and crisp lines only: large soft gradients band once the video is compressed.
const SVGNS = 'http://www.w3.org/2000/svg';
const orbits = document.createElementNS(SVGNS, 'svg');
Object.entries({ width: 1920, height: 1080, class: 'layer' }).forEach(([k, v]) => orbits.setAttribute(k, v));
bg.append(orbits);
const ORBITS = [
  { r: 230, o: .16, dash: '', speed: 0, sats: [] },
  { r: 370, o: .13, dash: '3 12', speed: 50, sats: [['#7aa7ff', 20], ['#f5b800', 200]] },
  { r: 530, o: .1, dash: '', speed: -32, sats: [['#b49cff', 110], ['#2aa8f2', 290]] },
  { r: 710, o: .09, dash: '1 16', speed: 22, sats: [['#ff8a3d', 60]] },
  { r: 910, o: .07, dash: '', speed: -14, sats: [['#34d399', 160], ['#ef4b5f', 330]] },
];
ORBITS.forEach(({ r, o, dash, speed, sats }, i) => {
  const g = document.createElementNS(SVGNS, 'g');
  g.style.transformOrigin = '960px 560px';
  const c = document.createElementNS(SVGNS, 'circle');
  Object.entries({ cx: 960, cy: 560, r, fill: 'none', stroke: `rgba(122,167,255,${o})`, 'stroke-width': 1.5, 'stroke-dasharray': dash }).forEach(([k, v]) => c.setAttribute(k, v));
  g.append(c);
  for (const [color, deg] of sats) {
    const s = document.createElementNS(SVGNS, 'circle');
    const a = (deg * Math.PI) / 180;
    Object.entries({ cx: 960 + Math.cos(a) * r, cy: 560 + Math.sin(a) * r, r: 4, fill: color, opacity: .75 }).forEach(([k, v]) => s.setAttribute(k, v));
    g.append(s);
  }
  orbits.append(g);
  set(g, { opacity: 0 });
  A(g, [{ opacity: 0, transform: 'scale(.82)' }, { opacity: 1, transform: 'scale(1)' }], 200 + i * 160, 1400);
  A(c, [{ strokeDashoffset: 0 }, { strokeDashoffset: speed * 8 }], 0, DURATION, 'linear');
  if (speed) A(g, [{ rotate: '0deg' }, { rotate: `${speed}deg` }], 0, DURATION, 'linear');
});
A($('#grid'), [{ translate: '0px 0px' }, { translate: '64px 64px' }], 0, DURATION, 'linear');
set(bg, { opacity: 0 });
A(bg, [{ opacity: 0 }, { opacity: 1 }], 0, 900, 'linear');

let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
for (let i = 0; i < 70; i++) {
  const x = rnd() * 1920, y = rnd() * 1180, r = 1 + rnd() * 2.4, o = .15 + rnd() * .45;
  const d = set(mk('div', 'spark', null, bg), { width: r * 2 + 'px', height: r * 2 + 'px', translate: px([x, y]), opacity: 0 });
  A(d, [{ translate: px([x, y]) }, { translate: px([x + (rnd() - .5) * 160, y - 160 - rnd() * 200]) }], 0, DURATION, 'linear');
  const ph = rnd() * 4000;
  A(d, [{ opacity: 0 }, { opacity: o, offset: .2 }, { opacity: o * .3, offset: .5 }, { opacity: o, offset: .8 }, { opacity: 0 }], ph, 6000 + rnd() * 5000, 'ease-in-out');
  for (let k = ph + 9000; k < DURATION; k += 9000) A(d, [{ opacity: 0 }, { opacity: o, offset: .25 }, { opacity: o * .3, offset: .5 }, { opacity: o, offset: .75 }, { opacity: 0 }], k, 8000, 'ease-in-out');
}

function drawLogo(el, start) {
  set(el, { opacity: 0 });
  A(el, [{ opacity: 0 }, { opacity: 1 }], start, 120, 'linear');
  el.querySelectorAll('path').forEach((p, i) => {
    set(p, { strokeDasharray: '1', strokeDashoffset: '1' });
    A(p, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], start + i * 180, 750, INOUT);
  });
  A(el, [{ filter: 'drop-shadow(0 0 0px rgba(59,123,240,0))', rotate: '-8deg' }, { filter: 'drop-shadow(0 0 30px rgba(59,123,240,.6))', rotate: '0deg' }], start, 1100);
}
function impact(layer, start, at) {
  A($('#flash'), [{ opacity: 0 }, { opacity: .12, offset: .1 }, { opacity: 0 }], start, 900, 'ease-out');
  [0, 140, 280].forEach((lag, i) => {
    const b = set(mk('div', 'burst', null, layer), { translate: px(at), opacity: 0 });
    A(b, [{ opacity: .9 - i * .2, scale: .15 }, { opacity: 0, scale: 2.6 + i * .8 }], start + lag, 1300, 'cubic-bezier(.15,.7,.3,1)');
  });
  const k = [];
  for (let i = 0; i <= 10; i++) { const a = 9 * (1 - i / 10) ** 2; k.push({ translate: `${i % 2 ? a : -a}px ${i % 3 ? -a / 2 : a / 2}px` }); }
  A(layer, k, start, 450, 'linear');
}

function headline(html, start, end, parent = world, top = 74) {
  const el = set(mk('div', 'head', null, parent), { top: top + 'px' });
  const tmp = mk('div', null, html);
  let i = 0;
  for (const node of [...tmp.childNodes]) {
    const isGrad = node.nodeType === 1;
    for (const word of node.textContent.split(/(?<= )/)) {
      const w = set(mk('span', 'w' + (isGrad ? ' grad' : ''), null, el), { opacity: 0 });
      w.textContent = word;
      A(w, [{ opacity: 0, translate: '0 34px', filter: 'blur(14px)' }, { opacity: 1, translate: '0 0', filter: 'blur(0px)' }], start + i * 70, 800);
      i++;
    }
  }
  if (end) A(el, [{ opacity: 1, filter: 'blur(0px)', translate: '0 0' }, { opacity: 0, filter: 'blur(12px)', translate: '0 -24px' }], end, 500, 'ease-in');
  return el;
}

const NODE = [960, 560];
const BROWSERS = [
  { name: 'Chrome', color: '#f5b800', pos: [430, 420], scatter: [330, 360, -7], count: 14 },
  { name: 'Edge', color: '#2aa8f2', pos: [1490, 420], scatter: [1560, 330, 6], count: 9 },
  { name: 'Brave', color: '#fb542b', pos: [330, 800], scatter: [560, 790, 4], count: 21 },
  { name: 'Vivaldi', color: '#ef4b5f', pos: [1590, 800], scatter: [1370, 830, -5], count: 6 },
  { name: 'Firefox', color: '#ff8a3d', pos: [960, 890], scatter: [960, 560, 2], count: 11 },
];
const SCATTERED = [
  [['f', 'Work'], ['GitHub', '#e2e8f0'], ['MDN Web Docs', '#93c5fd'], ['f', 'Reading list']],
  [['f', 'Travel'], ['Weather', '#7dd3fc'], ['GitHub', '#e2e8f0'], ['f', 'Work (old)']],
  [['f', 'Recipes'], ['GitHub', '#e2e8f0', 'dupe'], ['GitHub', '#e2e8f0', 'dupe'], ['Lisbon guide', '#fca5a5']],
  [['f', 'Reading list'], ['Sprint board', '#a7f3d0'], ['News', '#fde68a']],
  [['Weather', '#7dd3fc'], ['f', 'Work'], ['Train times', '#c4b5fd'], ['Pasta al limone', '#fdba74']],
];
const ROW_Y = (i) => 46 + i * 40;

function rowEl(parent, [title, color, extra], i) {
  const r = set(mk('div', 'row' + (extra ? ' ' + extra : ''), null, parent), { translate: `0 ${ROW_Y(i)}px` });
  const ic = mk('div', 'ic', null, r);
  if (title === 'f') { ic.innerHTML = FOLDER; title = color; }
  else { ic.textContent = title[0]; ic.style.background = color; }
  const t = mk('div', 't', null, r);
  mk('span', null, null, t).textContent = title;
  return r;
}

const wins = BROWSERS.map((b, bi) => {
  const w = set(mk('div', 'win', null, world), { translate: px(b.scatter), rotate: b.scatter[2] + 'deg', opacity: 0 });
  const bar = mk('div', 'bar', '<span class="dot"></span><span class="dot"></span><span class="dot"></span>', w);
  mk('span', 'bname', `<i style="background:${b.color}"></i>${b.name}`, bar);
  const count = mk('div', 'count', null, bar);
  const c1 = mk('span', null, null, count); c1.textContent = `${b.count} bookmarks`;
  const c2 = set(mk('span', null, null, count), { opacity: 0 }); c2.textContent = '23 bookmarks';
  const c3 = set(mk('span', null, null, count), { opacity: 0 }); c3.textContent = '24 bookmarks';
  const scattered = SCATTERED[bi].map((r, i) => rowEl(w, r, i));
  const rows = {
    hn: rowEl(w, ['Hacker News', '#fdba74'], 0),
    work: rowEl(w, ['f', 'Work'], 0),
    read: rowEl(w, ['f', 'Reading list'], 1),
    travel: rowEl(w, ['f', 'Travel'], 2),
    gh: rowEl(w, ['GitHub', '#e2e8f0'], 3),
  };
  for (const r of Object.values(rows)) r.style.opacity = 0;
  const alt = (row, text) => { const s = set(mk('span', null, null, row.querySelector('.t')), { opacity: 0 }); s.textContent = text; return [row.querySelector('.t span'), s]; };
  const ok = set(mk('div', 'pill-ok', '✓ Up to date', w), { opacity: 0 });
  return { ...b, el: w, count: [c1, c2, c3], scattered, rows, workAlt: alt(rows.work, 'Work · Q4'), readAlt: alt(rows.read, 'Read later'), ok };
});

function edge(c, d, w = 320, h = 210) {
  const dx = d[0] - c[0], dy = d[1] - c[1];
  const t = Math.min(w / 2 / Math.abs(dx || 1e-6), h / 2 / Math.abs(dy || 1e-6));
  return [c[0] + dx * t, c[1] + dy * t];
}
function nodeEdge(p, r = 84) {
  const dx = p[0] - NODE[0], dy = p[1] - NODE[1], l = Math.hypot(dx, dy);
  return [NODE[0] + (dx / l) * r, NODE[1] + (dy / l) * r];
}
for (const w of wins) { w.out = edge(w.pos, NODE); w.in = nodeEdge(w.pos); }

function packet(from, to, start, dur = 650) {
  [['pk tr', 90, .45], ['pk tr', 45, .7], ['pk', 0, 1]].forEach(([cls, lag, o]) => {
    const p = set(mk('div', cls, null, world), { opacity: 0, translate: px(from) });
    A(p, [{ translate: px(from), opacity: 0, scale: .4 }, { opacity: o, scale: 1, offset: .18 }, { opacity: o, offset: .82 }, { translate: px(to), opacity: 0, scale: .7 }], start + lag, dur, 'cubic-bezier(.5,0,.25,1)');
  });
}
function cipher(from, to, start, text, dur = 1100) {
  const p = set(mk('div', 'pk cipher', null, world), { opacity: 0, translate: px(from) });
  p.textContent = text;
  A(p, [{ translate: px(from), opacity: 0, scale: .6 }, { opacity: 1, scale: 1, offset: .15 }, { opacity: 1, offset: .85 }, { translate: px(to), opacity: 0, scale: .7 }], start, dur, 'cubic-bezier(.5,0,.25,1)');
