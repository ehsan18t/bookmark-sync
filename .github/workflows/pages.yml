name: Website

on:
  push:
    branches: [main]
    paths: [site/**, .env.example, scripts/build-site.mjs, public/icon/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-site.mjs .output/site
        env:
          WXT_APP_NAME: ${{ vars.WXT_APP_NAME }}
          WXT_APP_DESCRIPTION: ${{ vars.WXT_APP_DESCRIPTION }}
          WXT_HOMEPAGE_URL: ${{ vars.WXT_HOMEPAGE_URL }}
          WXT_PRIVACY_URL: ${{ vars.WXT_PRIVACY_URL }}
          WXT_SUPPORT_EMAIL: ${{ vars.WXT_SUPPORT_EMAIL }}
          WXT_SOURCE_URL: ${{ vars.WXT_SOURCE_URL }}
          WXT_CHROME_STORE_URL: ${{ vars.WXT_CHROME_STORE_URL }}
          WXT_EDGE_STORE_URL: ${{ vars.WXT_EDGE_STORE_URL }}
          WXT_FIREFOX_STORE_URL: ${{ vars.WXT_FIREFOX_STORE_URL }}
          WXT_PRIVACY_UPDATED: ${{ vars.WXT_PRIVACY_UPDATED }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/site
      - id: deployment
        uses: actions/deploy-pages@v4
